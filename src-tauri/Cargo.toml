[package]
name = "doom_vibing"
version = "0.1.2"
description = "doom-vibing — Terminal Workspace Manager"
authors = ["doom-vibing"]
edition = "2021"

[lib]
name = "doom_vibing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
